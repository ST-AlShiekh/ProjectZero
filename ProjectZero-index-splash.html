<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="PROJECT ZERO — ادخل إلى الأرشيف السري.">
  <title>PROJECT ZERO — بوابة الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--red:#e32636;--red-soft:#ff4b55;--bg:#080808;--muted:#888}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f5f5}
    body{min-height:100svh;display:grid;place-items:center;overflow:hidden;font-family:'IBM Plex Sans Arabic',sans-serif;background:radial-gradient(ellipse at 50% 44%,rgba(160,12,25,.13),transparent 42%),#080808}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.035) 4px,transparent 5px)}
    body:after{content:"";position:fixed;inset:18px;border:1px solid rgba(227,38,54,.13);pointer-events:none}
    .corner{position:fixed;font:10px 'IBM Plex Mono',monospace;letter-spacing:.13em;color:#686868;line-height:1.8}
    .corner.top{top:34px;left:38px;direction:ltr}.corner.bottom{right:38px;bottom:34px;text-align:right}
    main{width:min(90vw,540px);text-align:center;position:relative;z-index:1;animation:appear .7s ease-out both}
    .seal{width:68px;height:68px;margin:0 auto 25px;border:1px solid rgba(227,38,54,.8);border-radius:50%;display:grid;place-items:center;color:var(--red-soft);font:300 32px Arial,sans-serif;box-shadow:0 0 34px rgba(227,38,54,.12),inset 0 0 22px rgba(227,38,54,.06);position:relative}
    .seal:after{content:"";position:absolute;inset:-6px;border:1px solid rgba(227,38,54,.16);border-radius:50%}
    .eyebrow{font:10px 'IBM Plex Mono',monospace;letter-spacing:.24em;color:#a5a5a5;margin:0 0 14px;direction:ltr}
    h1{direction:ltr;font:500 clamp(28px,6vw,43px) 'IBM Plex Mono',monospace;letter-spacing:.16em;margin:0;padding-left:.16em}
    h1 span{color:var(--red)}
    .line{height:1px;width:72px;background:var(--red);margin:22px auto;box-shadow:0 0 13px rgba(227,38,54,.55)}
    h2{font-size:clamp(19px,4vw,24px);font-weight:500;margin:0 0 12px}
    .desc{color:#999;font-size:13px;line-height:2;margin:0 auto 31px;max-width:390px}
    .enter{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:52px;padding:0 25px;border:1px solid rgba(227,38,54,.8);background:linear-gradient(110deg,rgba(227,38,54,.14),rgba(227,38,54,.035));color:#fff;text-decoration:none;font-size:14px;font-weight:500;transition:background .22s,border-color .22s,transform .22s,box-shadow .22s;box-shadow:0 0 22px rgba(227,38,54,.05)}
    .enter:hover,.enter:focus-visible{background:rgba(227,38,54,.2);border-color:var(--red-soft);box-shadow:0 0 28px rgba(227,38,54,.13);transform:translateY(-2px);outline:none}
    .arrow{font:18px 'IBM Plex Mono',monospace;color:var(--red-soft);direction:ltr}
    .foot{margin-top:27px;font:9px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#555;direction:ltr}
    @keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="corner top">PZ / 01<br>CLASSIFIED ARCHIVE</div>
  <div class="corner bottom">ACCESS RESTRICTED<br>PROJECT ZERO</div>
  <main>
    <div class="seal" aria-hidden="true">Ø</div>
    <p class="eyebrow">CONFIDENTIAL STORY ARCHIVE</p>
    <h1>PROJECT <span>ZERO</span></h1>
    <div class="line" aria-hidden="true"></div>
    <h2>كل سرّ يترك أثرًا.</h2>
    <p class="desc">أنت على وشك الدخول إلى أرشيف لا يُفترض أن تراه.<br>تابع فقط إذا كنت مستعدًا لكشف الحقيقة.</p>
    <a class="enter" href="01-project-zero.html"><span>الدخول إلى الحنكة الإبداعية</span><span class="arrow" aria-hidden="true">↗</span></a>
    <div class="foot">AUTHORIZED ACCESS ONLY · PZ-01</div>
  </main>
</body>
</html>
